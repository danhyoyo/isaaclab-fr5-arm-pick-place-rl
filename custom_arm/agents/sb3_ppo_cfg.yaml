# Reference: https://github.com/DLR-RM/rl-baselines3-zoo/blob/master/hyperparams/ppo.yml#L32
seed: 42

# epoch * n_steps * nenvs: 500×512*8*8
n_timesteps: 2417160000 # 1611440000
policy: 'MlpPolicy'
n_steps: 512
# mini batch size: num_envs * nsteps / nminibatches 2048×512÷2048
batch_size: 2048
gae_lambda: 0.95
gamma: 0.98
n_epochs: 5
ent_coef: 0.006
vf_coef: 1.0
learning_rate: !!float 1e-4
clip_range: 0.2
policy_kwargs:
  log_std_init: 0.5
  activation_fn: 'nn.ELU'
  net_arch:
    pi: [256, 128, 64]
    vf: [256, 128, 64]
target_kl: 0.01
max_grad_norm: 1.0

